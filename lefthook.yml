pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: '*.{ts,vue,json,md,yml}'
      run: bun run fmt {staged_files}
      exclude:
        - 'CHANGELOG.md'
      stage_fixed: true

    - name: lint
      glob: '*.{ts,vue}'
      exclude:
        - '**/*.d.ts'
      run: bun run lint {staged_files}

pre-push:
  parallel: true
  jobs:
    - name: check
      run: bun run check

    - name: test
      run: bun run test
